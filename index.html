<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reporte Comercial</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1d2433; --muted:#6b7280; --accent:#2563eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111418; --card:#1b2027; --text:#e6e8eb; --muted:#9aa3ad; --accent:#60a5fa; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
    main { max-width:900px; margin:0 auto; padding:32px 16px; }
    h1 { margin:0 0 4px; font-size:1.6rem; }
    .sub { color:var(--muted); margin:0 0 24px; }
    .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
    .kpi { background:var(--card); border-radius:10px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
    .kpi span { display:block; color:var(--muted); font-size:.85rem; }
    .kpi strong { font-size:1.6rem; color:var(--accent); }
    .note { margin-top:24px; padding:16px; background:var(--card); border-radius:10px; color:var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Reporte Comercial</h1>
    <p class="sub">Última actualización: <span id="fecha">—</span></p>

    <section class="kpis">
      <div class="kpi"><span>Oportunidades abiertas</span><strong>—</strong></div>
      <div class="kpi"><span>Ventas del mes</span><strong>—</strong></div>
      <div class="kpi"><span>Tasa de conversión</span><strong>—</strong></div>
    </section>

    <p class="note">Página de ejemplo. El reporte automático va a reemplazar este contenido.</p>
  </main>
  <script>
    document.getElementById("fecha").textContent = new Date().toLocaleString("es-AR");
  </script>
</body>
</html>
